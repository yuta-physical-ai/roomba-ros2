# odom_source:=gazebo — the DiffDrive plugin provides /odom and odom->base_footprint.
- ros_topic_name: /odom
  gz_topic_name: /diff_drive/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name: /diff_drive/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS
